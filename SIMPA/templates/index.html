<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SIMPA - Assistente Acadêmico">

    <title>SIMPA | Assistente Acadêmico</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="container">
        <section class="card">
            <header class="header">
                <p class="tag">SIMPA</p>
                <h1>Assistente Acadêmico</h1>
                <p class="subtitle">
                    Faça uma pergunta e receba uma resposta do assistente.
                </p>
            </header>

            <form method="POST" class="question-form">
                <label for="pergunta">Sua pergunta</label>

                <textarea
                    id="pergunta"
                    name="pergunta"
                    rows="5"
                    placeholder="Digite sua pergunta..."
                    required
                >{{ pergunta }}</textarea>

                <button type="submit" class="button">
                    Perguntar
                </button>
            </form>

            {% if resposta %}
            <section class="answer" aria-live="polite">
                <h2>Resposta</h2>
                <p>{{ resposta }}</p>
            </section>
            {% endif %}
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
